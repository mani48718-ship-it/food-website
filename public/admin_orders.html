<!DOCTYPE html>

<html>
<head>
<title>Admin Orders</title>

<style>


body{
font-family:Arial;
background:#f5f5f5;
margin:0;
padding:20px;
}

.card{
background:white;
padding:18px;
margin:15px 0;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

h2{
margin-bottom:20px;
}

button{
padding:8px 14px;
margin:6px 5px 0 0;
border:none;
border-radius:6px;
cursor:pointer;
font-size:13px;
}

/* Buttons */

.accept{
background:#28a745;
color:white;
}

.preparing{
background:#ff9800;
color:white;
}

.out{
background:#58a1f0;
color:white;
}

.delivered{
background:#9dbfdd;
color:white;
}

.delete{
background:rgb(235, 75, 75);
color:white;
}



</style>

</head>

<body>

<h2>📦 Live Orders</h2>
<div id="orders">Loading...</div>

<script>

const bell = new Audio("/bell.mp3");
let lastOrderId = 0;

function formatDate(time){
    if(!time) return "Not delivered yet";
    return new Date(time).toLocaleString();
}

async function loadOrders(){

    try{
        const res = await fetch("/admin/orders",{credentials:"include"});

        if(res.status===401 || res.redirected){
            window.location.href="/login";
            return;
        }

        const orders = await res.json();

        const div=document.getElementById("orders");
        div.innerHTML="";

        if(orders.length > 0){
    const newest = orders[0].id;

    if(lastOrderId !== 0 && newest > lastOrderId){
        bell.play();   // 🔔 NEW ORDER SOUND
    }

    lastOrderId = newest;
}

        orders.forEach(order=>{

            // hide delivered orders
            if(order.status==="Delivered") return;

            const delivered = formatDate(order.delivered_at);

            div.innerHTML += `
            <div class="ordercard">
            <b>Order #${order.id}</b><br>
            Name: ${order.customer_name}<br>
            Phone: ${order.phone || "-"}<br>
            Address: ${order.address || "-"}<br>
            Items: ${order.food_item}<br>
            Total: ₹${order.total_price}<br>

            Status: <b id="status-${order.id}">${order.status}</b><br>
            Delivered Time: <b>${delivered}</b><br><br>

           <button class="accept" onclick="updateStatus(${order.id},'Accepted')">Accept</button>

<button class="preparing" onclick="updateStatus(${order.id},'Preparing')">Preparing</button>

<button class="out" onclick="updateStatus(${order.id},'Out for Delivery')">Out</button>

<button class="delivered" onclick="updateStatus(${order.id},'Delivered')">Delivered</button>

<button class="delete" onclick="deleteOrder(${order.id})">Delete</button>
            </div>`;
        });

    }catch(err){
        document.getElementById("orders").innerHTML="⚠ Server sleeping... refresh in 10 seconds";
    }
}

async function updateStatus(id,status){
    await fetch(`/admin/update-status/${id}/${status}`,{
        method:"POST",
        credentials:"include"
    });
    loadOrders();
}

async function deleteOrder(id){

    if(!confirm("Delete this order permanently?")) return;

    await fetch(`/admin/delete-order/${id}`,{
        method:"DELETE",
        credentials:"include"
    });

    loadOrders();
}

setInterval(loadOrders,5000);


</script>

</body>
</html>
