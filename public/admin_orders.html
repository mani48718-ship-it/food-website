<!DOCTYPE html>

<html>
<head>
<title>Admin Orders</title>

<style>


body{
font-family:Segoe UI, Arial;
background:#f4f6f9;
margin:0;
padding:20px;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
background:#ff4d4d;
color:white;
padding:15px 20px;
border-radius:8px;
margin-bottom:20px;
}

.header a{
color:white;
text-decoration:none;
margin-left:15px;
font-weight:bold;
}

/* ORDER CARD */

.orderCard{
background:white;
padding:18px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.orderCard h3{
margin-top:0;
color:#333;
}

/* STATUS */

.status{
font-weight:bold;
}

.ready{
color:#28a745;
}

.preparing{
color:#ff9800;
}

.out{
color:#007bff;
}

.delivered{
color:#6c757d;
}

/* BUTTONS */

button{
border:none;
padding:8px 12px;
margin:5px 5px 0 0;
border-radius:6px;
cursor:pointer;
font-size:13px;
}

.accept{
background:#28a745;
color:white;
}

.preparingBtn{
background:#ff9800;
color:white;
}

.outBtn{
background:#007bff;
color:white;
}

.deliveredBtn{
background:#6c757d;
color:white;
}

.deleteBtn{
background:black;
color:white;
}



</style>

</head>

<body>

<h2>📦 Live Orders</h2>
<div id="orders">Loading...</div>

<script>

const bell = new Audio("/bell.mp3");
let lastOrderId = 0;

function formatDate(time){
    if(!time) return "Not delivered yet";
    return new Date(time).toLocaleString();
}

async function loadOrders(){

    try{
        const res = await fetch("/admin/orders",{credentials:"include"});

        if(res.status===401 || res.redirected){
            window.location.href="/login";
            return;
        }

        const orders = await res.json();

        const div=document.getElementById("orders");
        div.innerHTML="";

        if(orders.length > 0){
    const newest = orders[0].id;

    if(lastOrderId !== 0 && newest > lastOrderId){
        bell.play();   // 🔔 NEW ORDER SOUND
    }

    lastOrderId = newest;
}

        orders.forEach(order=>{

            // hide delivered orders
            if(order.status==="Delivered") return;

            const delivered = formatDate(order.delivered_at);

            div.innerHTML += `
            <div class="ordercard">
            <b>Order #${order.id}</b><br>
            Name: ${order.customer_name}<br>
            Phone: ${order.phone || "-"}<br>
            Address: ${order.address || "-"}<br>
            Items: ${order.food_item}<br>
            Total: ₹${order.total_price}<br>

            Status: <b id="status-${order.id}">${order.status}</b><br>
            Delivered Time: <b>${delivered}</b><br><br>

            <button onclick="updateStatus(${order.id},'Accepted')">Accept</button>
            <button onclick="updateStatus(${order.id},'Preparing')">Preparing</button>
            <button onclick="updateStatus(${order.id},'Out for Delivery')">Out</button>
            <button onclick="updateStatus(${order.id},'Delivered')">Delivered</button>
            <button onclick="deleteOrder(${order.id})" style="background:black">Delete</button>
            </div>`;
        });

    }catch(err){
        document.getElementById("orders").innerHTML="⚠ Server sleeping... refresh in 10 seconds";
    }
}

async function updateStatus(id,status){
    await fetch(`/admin/update-status/${id}/${status}`,{
        method:"POST",
        credentials:"include"
    });
    loadOrders();
}

async function deleteOrder(id){

    if(!confirm("Delete this order permanently?")) return;

    await fetch(`/admin/delete-order/${id}`,{
        method:"DELETE",
        credentials:"include"
    });

    loadOrders();
}

setInterval(loadOrders,5000);


</script>

</body>
</html>
