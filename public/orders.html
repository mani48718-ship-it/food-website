<!DOCTYPE html>
<html>
<head>
<title>My Orders</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
margin:0;
}

/* header */
.header{
background:#ff4d4d;
color:white;
padding:15px;
font-size:22px;
font-weight:bold;
}

.container{
margin-top:20px;
}

input{
padding:10px;
width:250px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:10px 16px;
background:#ff4d4d;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.orderCard{
background:white;
width:340px;
margin:15px auto;
padding:15px;
border-radius:12px;
box-shadow:0 0 10px #ccc;
text-align:left;
}

.status{
margin-top:6px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="header" style="display:flex;justify-content:space-between;align-items:center;padding:15px 20px;">
    <div style="font-size:22px;font-weight:bold;">📜 My Orders</div>
    <a href="/menu.html" style="
        background:white;
        color:#ff4d4d;
        padding:8px 14px;
        border-radius:8px;
        text-decoration:none;
        font-weight:bold;">
        🍽 Menu
    </a>
</div>

<div style="margin-top:10px;">
<a href="/track.html" style="
background:#ff4d4d;
color:white;
padding:10px 16px;
border-radius:8px;
text-decoration:none;
font-weight:bold;">
📦 Track Active Order
</a>
</div>

<div class="container">

<input id="phone" placeholder="Enter phone number">
<button onclick="loadOrders()">View Orders</button>

<div id="ordersList"></div>

</div>

<script>

async function loadOrders(){

const phone=document.getElementById("phone").value;
if(!phone){
alert("Enter phone number");
return;
}

const res=await fetch("/track-order/"+phone);
const data=await res.json();

const list=document.getElementById("ordersList");
list.innerHTML="";

if(!data.found){
list.innerHTML="<h3>No previous orders</h3>";
return;
}

data.orders.forEach(order=>{

let statusText="";

if(order.status==="PENDING")
statusText="🟡 Waiting for payment verification";

else if(order.status==="CONFIRMED")
statusText="🟢 Preparing";

else if(order.status==="Ready")
statusText="👨‍🍳 Ready";

else if(order.status==="Out for Delivery")
statusText="🚴 Out for delivery";

else if(order.status==="Delivered")
statusText="✅ Delivered";

list.innerHTML+=`
<div class="orderCard">
<b>Order #${order.id}</b><br><br>
🍽 ${order.food_item}<br>
💰 ₹${order.total_price}<br>
📍 ${order.address}<br>
<div class="status">${statusText}</div>
</div>
`;

});

}

</script>

</body>
</html>
